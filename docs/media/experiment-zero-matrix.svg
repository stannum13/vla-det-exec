<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="matrix-title matrix-desc">
  <title id="matrix-title">Experiment Zero model and inference condition matrix</title>
  <desc id="matrix-desc">ACT compares sampled and zero latents, VQ-BeT compares sampled and argmax tokens, and MolmoAct2 compares fresh and fixed-seed flow noise. Diagnostics include action drift, token entropy, trajectory drift, and latency.</desc>
  <rect width="1200" height="430" rx="24" fill="#f7f8fa"/>
  <text x="52" y="51" font-family="Inter, ui-sans-serif, system-ui" font-size="26" font-weight="700" fill="#182230">Three policy families · two execution modes · one fixed-input protocol</text>
  <text x="52" y="79" font-family="Inter, ui-sans-serif, system-ui" font-size="15" fill="#5b6675">Each row changes only the model-specific source of inference-time variation.</text>

  <g font-family="Inter, ui-sans-serif, system-ui">
    <rect x="45" y="108" width="1110" height="48" rx="10" fill="#24364b"/>
    <text x="80" y="139" font-size="14" font-weight="700" fill="#ffffff">MODEL FAMILY</text>
    <text x="300" y="139" font-size="14" font-weight="700" fill="#ffffff">STOCHASTIC PATH</text>
    <text x="600" y="139" font-size="14" font-weight="700" fill="#ffffff">DETERMINISTIC PATH</text>
    <text x="900" y="139" font-size="14" font-weight="700" fill="#ffffff">PRIMARY DIAGNOSTIC</text>

    <rect x="45" y="164" width="1110" height="66" rx="8" fill="#ffffff" stroke="#d6dde7"/>
    <rect x="45" y="238" width="1110" height="66" rx="8" fill="#edf4ff" stroke="#bdcde1"/>
    <rect x="45" y="312" width="1110" height="66" rx="8" fill="#ffffff" stroke="#d6dde7"/>

    <text x="80" y="204" font-size="18" font-weight="750" fill="#182230">ACT</text>
    <text x="300" y="204" font-size="16" fill="#455568">sampled latent</text>
    <text x="600" y="204" font-size="16" fill="#315f99">fixed zero latent</text>
    <text x="900" y="204" font-size="16" fill="#455568">action-array drift</text>

    <text x="80" y="278" font-size="18" font-weight="750" fill="#182230">VQ-BeT</text>
    <text x="300" y="278" font-size="16" fill="#455568">sampled action token</text>
    <text x="600" y="278" font-size="16" fill="#315f99">argmax action token</text>
    <text x="900" y="278" font-size="16" fill="#455568">token entropy</text>

    <text x="80" y="352" font-size="18" font-weight="750" fill="#182230">MolmoAct2</text>
    <text x="300" y="352" font-size="16" fill="#455568">fresh flow noise</text>
    <text x="600" y="352" font-size="16" fill="#315f99">fixed-seed flow noise</text>
    <text x="900" y="352" font-size="16" fill="#455568">trajectory drift</text>

    <rect x="45" y="392" width="1110" height="26" rx="8" fill="#fff4df"/>
    <text x="600" y="410" text-anchor="middle" font-size="13" font-weight="650" fill="#714b0c">Same stored inputs · 100 calls per condition · 100 ms policy deadline · latency reported for every row</text>
  </g>
</svg>
